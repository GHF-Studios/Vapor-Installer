[package]
name = "vapor_installer"
version.workspace = true
edition.workspace = true
readme = "../../README.md"

[[bin]]
name = "vapor-installer"
path = "src/main.rs"

[dependencies]
vapor_core = { path = "../../../Vapor/crates/vapor_core" }
vapor_product_layout = { path = "../../../Vapor/crates/vapor_product_layout" }
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
toml = "0.8"
